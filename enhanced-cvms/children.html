<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child Management - VaxTracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .children-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .child-card {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 0.75rem;
            padding: 1.5rem;
            transition: all 0.3s;
            position: relative;
        }

        .child-card:hover {
            border-color: #7c3aed;
            box-shadow: 0 8px 16px rgba(124, 58, 237, 0.15);
        }

        .child-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e3a8a, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .child-info h3 {
            margin: 0.5rem 0;
            color: #1e3a8a;
        }

        .child-info p {
            margin: 0.25rem 0;
            color: #6b7280;
            font-size: 0.95rem;
        }

        .child-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin: 1rem 0;
            padding: 1rem 0;
            border-top: 1px solid #e5e7eb;
            border-bottom: 1px solid #e5e7eb;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #7c3aed;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #6b7280;
        }

        .child-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .child-actions button {
            flex: 1;
        }

        .modal-content {
            background: white;
            border-radius: 0.75rem;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #1f2937;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .modal-actions button {
            flex: 1;
        }

        .add-child-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
        }

        .empty-state i {
            font-size: 3rem;
            color: #d1d5db;
            margin-bottom: 1rem;
        }

        .empty-state h3 {
            color: #6b7280;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-syringe"></i>
                    <span>VaxTracker</span>
                </div>
                <nav class="nav">
                    <a href="dashboard.html">Dashboard</a>
                    <a href="vaccinations.html">Vaccinations</a>
                    <a href="children.html" class="active">Children</a>
                    <a href="appointments.html">Appointments</a>
                </nav>
                <div class="user-menu">
                    <span id="userName">User</span>
                    <button class="btn btn-sm btn-ghost" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h1>Manage Children</h1>
                <button class="btn btn-primary add-child-btn" onclick="openAddChildModal()">
                    <i class="fas fa-plus"></i> Add Child
                </button>
            </div>

            <!-- Children Grid -->
            <div id="childrenContainer" class="children-grid">
                <!-- Populated by JavaScript -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state" style="display: none;">
                <i class="fas fa-child"></i>
                <h3>No children added yet</h3>
                <p style="color: #6b7280; margin-bottom: 1.5rem;">Add your first child's information to get started</p>
                <button class="btn btn-primary" onclick="openAddChildModal()">
                    <i class="fas fa-plus"></i> Add Child
                </button>
            </div>
        </div>
    </main>

    <!-- Modal for Add/Edit Child -->
    <div id="childModal" class="modal" style="display: none;">
        <div class="modal-overlay" onclick="closeChildModal()"></div>
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2 id="modalTitle">Add Child</h2>
                <button class="btn btn-ghost" onclick="closeChildModal()" style="padding: 0.5rem;">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <form id="childForm" onsubmit="saveChild(event)">
                <div class="form-group">
                    <label for="childName">Child's Name *</label>
                    <input type="text" id="childName" required>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth *</label>
                    <input type="date" id="dob" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender">
                        <option value="">Select gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="bloodType">Blood Type</label>
                    <select id="bloodType">
                        <option value="">Select blood type</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeChildModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Child</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let children = [];
        let editingChildId = null;

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            const userName = localStorage.getItem('userName');
            if (!userName) {
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('userName').textContent = userName;
            loadChildren();
        });

        function loadChildren() {
            const stored = localStorage.getItem('children');
            children = stored ? JSON.parse(stored) : [
                {
                    id: 1,
                    name: 'Alice Johnson',
                    dob: '2020-03-15',
                    gender: 'female',
                    bloodType: 'O+',
                    vaccinations: 12
                },
                {
                    id: 2,
                    name: 'Bob Johnson',
                    dob: '2018-07-22',
                    gender: 'male',
                    bloodType: 'A+',
                    vaccinations: 18
                }
            ];
            renderChildren();
        }

        function renderChildren() {
            const container = document.getElementById('childrenContainer');
            const emptyState = document.getElementById('emptyState');

            if (children.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            container.innerHTML = children.map(child => {
                const age = calculateAge(child.dob);
                return `
                    <div class="child-card">
                        <div class="child-avatar">
                            <i class="fas fa-${child.gender === 'female' ? 'user' : 'user-tie'}"></i>
                        </div>
                        <div class="child-info">
                            <h3>${child.name}</h3>
                            <p><strong>Age:</strong> ${age} year${age !== 1 ? 's' : ''} old</p>
                            <p><strong>DOB:</strong> ${formatDate(child.dob)}</p>
                            ${child.bloodType ? `<p><strong>Blood Type:</strong> ${child.bloodType}</p>` : ''}
                        </div>
                        <div class="child-stats">
                            <div class="stat">
                                <div class="stat-value">${child.vaccinations || 0}</div>
                                <div class="stat-label">Vaccinations</div>
                            </div>
                            <div class="stat">
                                <div class="stat-value">5</div>
                                <div class="stat-label">Upcoming</div>
                            </div>
                        </div>
                        <div class="child-actions">
                            <button class="btn btn-sm btn-primary" onclick="viewChild(${child.id})">
                                <i class="fas fa-eye"></i> View
                            </button>
                            <button class="btn btn-sm btn-secondary" onclick="editChild(${child.id})">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteChild(${child.id})">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openAddChildModal() {
            editingChildId = null;
            document.getElementById('modalTitle').textContent = 'Add Child';
            document.getElementById('childForm').reset();
            document.getElementById('childModal').style.display = 'flex';
        }

        function closeChildModal() {
            document.getElementById('childModal').style.display = 'none';
            document.getElementById('childForm').reset();
            editingChildId = null;
        }

        function editChild(id) {
            const child = children.find(c => c.id === id);
            if (!child) return;

            editingChildId = id;
            document.getElementById('modalTitle').textContent = 'Edit Child';
            document.getElementById('childName').value = child.name;
            document.getElementById('dob').value = child.dob;
            document.getElementById('gender').value = child.gender || '';
            document.getElementById('bloodType').value = child.bloodType || '';
            document.getElementById('childModal').style.display = 'flex';
        }

        function saveChild(event) {
            event.preventDefault();

            const childData = {
                name: document.getElementById('childName').value,
                dob: document.getElementById('dob').value,
                gender: document.getElementById('gender').value,
                bloodType: document.getElementById('bloodType').value
            };

            if (editingChildId) {
                const idx = children.findIndex(c => c.id === editingChildId);
                if (idx !== -1) {
                    children[idx] = { ...children[idx], ...childData };
                }
            } else {
                children.push({
                    id: Date.now(),
                    ...childData,
                    vaccinations: 0
                });
            }

            localStorage.setItem('children', JSON.stringify(children));
            closeChildModal();
            renderChildren();
        }

        function viewChild(id) {
            localStorage.setItem('selectedChildId', id);
            window.location.href = 'vaccinations.html';
        }

        function deleteChild(id) {
            if (confirm('Are you sure you want to delete this child? This action cannot be undone.')) {
                children = children.filter(c => c.id !== id);
                localStorage.setItem('children', JSON.stringify(children));
                renderChildren();
            }
        }

        function calculateAge(dob) {
            const today = new Date();
            const birthDate = new Date(dob);
            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();
            
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            
            return Math.max(0, age);
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
