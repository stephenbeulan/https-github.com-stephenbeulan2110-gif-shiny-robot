<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#logoGradient)" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Vaccine syringe -->
  <g transform="translate(35, 25)">
    <!-- Syringe body -->
    <rect x="5" y="10" width="20" height="35" rx="2" fill="#FFFFFF"/>
    <!-- Syringe needle -->
    <rect x="0" y="8" width="8" height="2" fill="#FFFFFF"/>
    <!-- Plunger -->
    <rect x="8" y="5" width="6" height="8" fill="#FFFFFF"/>
    <circle cx="11" cy="40" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Heartbeat line -->
  <path d="M 20 60 Q 25 50 30 60 Q 35 70 40 60 Q 45 50 50 60 Q 55 70 60 60 Q 65 50 70 60 L 80 60"
        stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>